<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quarterly Wealth Inequality</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --border: #e0e0e0;
      --accent: #2a5db0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15161a;
        --text: #ececec;
        --muted: #9a9a9a;
        --border: #33343a;
        --accent: #7aa2f7;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .page { max-width: 960px; margin: 0 auto; padding: 2.5rem 1rem 3rem; }

    h1 { font-size: 1.6rem; margin-bottom: 1.5rem; }

    section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .chart-controls {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .chart-ctrl-label { font-size: 0.75rem; font-weight: 500; color: var(--muted); }

    .measure-tabs { display: flex; flex-direction: column; gap: 0.3rem; }

    .measure-row { display: flex; flex-wrap: wrap; gap: 0.3rem; }

    .measure-tab {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.5;
      padding: 0.2rem 0.55rem;
      border: 1.5px solid var(--accent);
      border-radius: 3px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .measure-tab[aria-pressed="true"] { background: var(--accent); color: var(--bg); }

    .measure-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .chart { height: 520px; }

    @media (max-width: 600px) {
      .page { padding-top: 1.5rem; }
      .chart { height: 440px; }
    }
  </style>
</head>
<body>

<div class="page">
  <h1>Quarterly Wealth Inequality in Canada</h1>

  <section>
    <div class="section-label">Chart</div>
    <div class="chart-controls">
      <span class="chart-ctrl-label" id="measure-label">Measure:</span>
      <div class="measure-tabs" id="measure-tabs" role="group" aria-labelledby="measure-label"></div>
    </div>
    <div class="chart" id="chart-top"></div>
  </section>
</div>

<script>
  const DATA = {"surveys":["2012Q4","2016Q4","2019Q4","2023Q2"],"quarterly":{"top_0_1pct":[2.7837,2.7734,2.7729,2.7775,2.8346,2.8947,2.9517,3.0099,3.0565,3.1114,3.1552,3.1784,3.2195,3.2526,3.2734,3.3053,3.3069,3.3481,3.3926,3.435,3.3784,3.3657,3.3701,3.3364,3.3061,3.2718,3.2632,3.2194,3.1689,3.1243,3.0713,3.0155,2.9451,2.9131,2.8747,2.8201,2.7733,2.732,2.6802,2.6144,2.5716,2.5343,2.4669,2.3912,2.2915,2.1908,2.2037,2.2086,2.2091,2.2155,2.233,2.2421,2.2339,2.2481,2.2589,2.2698,2.2684],"top_5pct":[34.5199,34.4247,34.4351,34.4771,34.5085,34.5386,34.5946,34.6806,34.6889,34.7673,34.8464,34.8154,34.8514,34.8908,34.9012,34.9152,34.7999,34.8674,34.938,35.0313,34.8696,34.9851,35.1789,35.17,35.1767,35.2004,35.377,35.3997,35.3483,35.3965,35.4136,35.3749,34.6076,34.294,33.9303,33.4219,32.8569,32.6017,32.1301,31.6179,31.336,31.3915,31.3057,31.161,30.7351,30.3487,30.4848,30.6132,30.5924,30.6578,30.9057,31.0223,30.9405,31.1158,31.2989,31.454,31.442],"top_20pct":[70.2802,70.1692,70.1807,70.2034,70.133,70.0543,70.0038,69.9991,69.9279,69.9052,69.926,69.8767,69.8529,69.7998,69.7543,69.6722,69.4655,69.4569,69.4701,69.4559,69.1942,69.3363,69.4946,69.5181,69.491,69.558,69.7241,69.7944,69.7108,69.7532,69.7724,69.7069,69.1019,68.7692,68.4115,67.878,67.182,67.0076,66.5368,65.9982,65.6946,66.0113,66.184,66.1916,65.7256,65.4075,65.6144,65.8156,65.6849,65.7679,66.0448,66.1596,66.0636,66.2437,66.4491,66.6407,66.598],"p80_p90":[19.9614,19.9635,19.9587,19.9408,19.9069,19.8806,19.8473,19.813,19.7887,19.7527,19.742,19.7558,19.7381,19.715,19.711,19.6785,19.6554,19.6298,19.6136,19.5686,19.4962,19.4859,19.4345,19.4301,19.3874,19.3882,19.3458,19.3478,19.3074,19.2753,19.2503,19.2147,19.3702,19.3758,19.4025,19.4234,19.3877,19.4478,19.4783,19.4985,19.4971,19.6361,19.7833,19.8718,19.8765,19.9418,19.9669,19.9973,19.9331,19.9355,19.9278,19.9158,19.9162,19.9022,19.904,19.9153,19.899],"top_10pct":[50.3188,50.2057,50.222,50.2626,50.2261,50.1737,50.1565,50.1861,50.1392,50.1525,50.184,50.1209,50.1148,50.0849,50.04 .9515,27.8293,27.821,27.7846,27.6027,27.529,27.5735,27.4616,27.3239,27.2306,27.237],"top_1pct":[13.4708,13.4282,13.4302,13.4554,13.5491,13.6596,13.7768,13.9007,13.978,14.1084,14.2305,14.2738,14.3694,14.4792,14.5575,14.6504,14.6548,14.7786,14.9029,15.0508,14.948,14.996,15.1117,15.0777,15.0702,15.0494,15.141,15.1161,15.0679,15.0719,15.0538,15.0126,14.5003,14.2963,14.0536,13.728,13.3872,13.1764,12.845,12.4921,12.264,12.1849,12.0323,11.8585,11.5409,11.2292,11.2951,11.3663,11.3653,11.3982,11.5368,11.5998,11.5559,11.6509,11.7482,11.8271,11.8224]},"quarters":["2012Q1","2012Q2","2012Q3","2012Q4","2013Q1","2013Q2","2013Q3","2013Q4","2014Q1","2014Q2","2014Q3","2014Q4","2015Q1","2015Q2","2015Q3","2015Q4","2016Q1","2016Q2","2016Q3","2016Q4","2017Q1","2017Q2","2017Q3","2017Q4","2018Q1","2018Q2","2018Q3","2018Q4","2019Q1","2019Q2","2019Q3","2019Q4","2020Q1","2020Q2","2020Q3","2020Q4","2021Q1","2021Q2","2021Q3","2021Q4","2022Q1","2022Q2","2022Q3","2022Q4","2023Q1","2023Q2","2023Q3","2023Q4","2024Q1","2024Q2","2024Q3","2024Q4","2025Q1","2025Q2","2025Q3","2025Q4","2026Q1"]};

  // The measures of the annual page; row is the row of buttons the measure sits in
  const MEASURES = [
    { key: "top_0_01pct", label: "Top 0.01%", digits: 1, row: 0 },
    { key: "top_0_1pct",  label: "Top 0.1%",  digits: 1, row: 0 },
    { key: "top_1pct",    label: "Top 1%",    digits: 1, row: 0 },
    { key: "top_5pct",    label: "Top 5%",    digits: 1, row: 0 },
    { key: "top_10pct",   label: "Top 10%",   digits: 1, row: 0 },
    { key: "top_20pct",   label: "Top 20%",   digits: 1, row: 0 },
    { key: "top_50pct",   label: "Top 50%",   digits: 1, row: 0 },
    { key: "p80_p90",     label: "Upper middle class (P80–P90)", digits: 1, row: 1 },
    { key: "p50_p80",     label: "Middle class (P50–P80)",       digits: 1, row: 1 },
    { key: "gini",        label: "Gini",      digits: 3, row: 2 },
  ];

  // The colour, marker and name of the SFS + NBSA line of the annual page
  const RED = "#ef553b", NAME = "SFS + NBSA";

  const THEMES = {
    light: { paper: "#ffffff", plot: "#E5ECF6", grid: "#ffffff", text: "#444444" },
    dark:  { paper: "#15161a", plot: "#1e1f24", grid: "#33343a", text: "#c8c8c8" },
  };

  const MARGIN_T = 50, MARGIN_B = 70, MARGIN_L = 60;
  const darkMode = window.matchMedia("(prefers-color-scheme: dark)");
  const Q = DATA.quarters;
  let measure = MEASURES[2];

  const isShare = m => m.key !== "gini";
  const theme = () => darkMode.matches ? THEMES.dark : THEMES.light;

  // The quarterly line, with a marker at each survey quarter. showlegend keeps the legend, which
  // Plotly hides for a single trace.
  function quarterlyTrace(t, y, fmt) {
    return {
      x: Q, y: y, name: NAME, type: "scatter", mode: "lines+markers", showlegend: true,
      line: { color: RED, width: 2, dash: "solid" },
      marker: { color: RED, symbol: "diamond", line: { color: t.plot, width: 2 },
                size: Q.map(q => DATA.surveys.includes(q) ? 10 : 0) },
      text: y.map(v => "<b>" + fmt(v) + "</b>  " + NAME),
      hovertemplate: "%{text}<extra></extra>",
    };
  }

  function range(ys) {
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = 0.1 * (hi - lo || Math.abs(hi) || 1);
    return [lo - pad, hi + pad];
  }

  function layout(el, t, title, ytitle, yrange) {
    const narrow  = el.offsetWidth < 560;
    const marginT = narrow ? 75 : MARGIN_T;
    const plotH   = Math.max((el.offsetHeight || 480) - marginT - MARGIN_B, 80);
    const years   = Q.filter(q => q.endsWith("Q1") && (narrow ? +q.slice(0, 4) % 2 === 0 : true));
    return {
      title: { text: narrow ? title.replace(" – ", "<br>") : title },
      font: { color: t.text },
      xaxis: {
        type: "category",
        tickmode: "array",
        tickvals: years,
        ticktext: years.map(q => q.slice(0, 4)),
        range: [-0.5, Q.length - 0.5],
        gridcolor: t.grid,
        spikedash: "solid",
        spikethickness: 1,
        spikecolor: t.text,
      },
      yaxis: { title: { text: ytitle }, range: yrange, gridcolor: t.grid, zeroline: false },
      legend: { x: 0.5, xanchor: "center", y: -(55 / plotH), orientation: "h" },
      margin: { l: MARGIN_L, b: MARGIN_B, r: 20, t: marginT },
      hovermode: "x unified",
      hoverlabel: { bgcolor: t.paper, font: { color: t.text } },
      paper_bgcolor: t.paper,
      plot_bgcolor: t.plot,
    };
  }

  function drawTop() {
    const t = theme(), el = document.getElementById("chart-top");
    const fmt = v => v.toFixed(measure.digits) + (isShare(measure) ? "%" : "");
    const y = DATA.quarterly[measure.key];
    const title = isShare(measure) ? "Share of Total Net Worth – " + measure.label : "Gini Coefficient of Net Worth";
    Plotly.react(el, [quarterlyTrace(t, y, fmt)],
                 layout(el, t, title, isShare(measure) ? "Share of Total Net Worth (%)" : "Gini Coefficient", range(y)),
                 { responsive: true });
  }

  const tabs = document.getElementById("measure-tabs");
  const rows = [];
  MEASURES.forEach(m => {
    if (!rows[m.row]) {
      rows[m.row] = document.createElement("div");
      rows[m.row].className = "measure-row";
      tabs.appendChild(rows[m.row]);
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "measure-tab";
    btn.textContent = m.label;
    btn.setAttribute("aria-pressed", String(m === measure));
    btn.addEventListener("click", () => {
      measure = m;
      tabs.querySelectorAll(".measure-tab").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      drawTop();
    });
    rows[m.row].appendChild(btn);
  });

  drawTop();
  darkMode.addEventListener("change", drawTop);

  // Recompute the legend position when the chart is resized.
  // Debounced to avoid a relayout -> resize -> relayout loop.
  let resizeTimer;
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawTop, 50);
  }).observe(document.getElementById("chart-top"));
</script>

</body>
</html>
