  // row is the row of buttons the measure sits in
  const MEASURES = [
    { key: "top_0_01pct", label: "Top 0.01%", digits: 1, row: 0 },
    { key: "top_0_1pct",  label: "Top 0.1%",  digits: 1, row: 0 },

    { key: "p80_p90",     label: "Upper middle class (P80–P90)", digits: 1, row: 1 },

  ];

  // One colour and marker per source, in order. The first three colours are the Inequality
  // Dashboard's, and the magenta was chosen to stay distinguishable from them with
  // colour-vision deficiency on both themes. The fourth line is dashed, since it
  // coincides with the third in 2019 and 2023.
  const COLORS  = ["#636efa", "#ef553b", "#00aa7a", "#a840a0"];
  const SYMBOLS = ["circle", "diamond", "square", "triangle-up"];
  const DASHES  = ["solid", "solid", "solid", "dash"];

  const THEMES = {
    light: { paper: "#ffffff", plot: "#E5ECF6", grid: "#ffffff", text: "#444444" },
    dark:  { paper: "#15161a", plot: "#1e1f24", grid: "#33343a", text: "#c8c8c8" },
  };

  const VIEWS = [
    { key: "share",   label: "Share of total net worth" },
    { key: "average", label: "Average net worth" },
    { key: "percentile", label: "Percentile" },
  ];

  const MARGIN_T = 50, MARGIN_B = 70, MARGIN_L = 60;
  const darkMode = window.matchMedia("(prefers-color-scheme: dark)");
  let current = MEASURES[2];
  let view = VIEWS[0];
  let pct = 50;

  const isShare      = m => m.key !== "gini";
  const isAverage    = () => view.key === "average";
  const isPercentile = () => view.key === "percentile";
  const series       = src => isPercentile() ? src.percentiles[pct]
                                             : (isAverage() ? src.averages : src.measures)[current.key];

  const ordinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
  // Each hover value gets its own unit, to three significant digits
  function dollars(v) {
    const a = Math.abs(v);
    if (a < 1e3) return (v < 0 ? "−$" : "$") + Math.round(a);
    const [scale, unit] = a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : [1e3, "K"];
    const x = a / scale;
    return (v < 0 ? "−$" : "$") + x.toFixed(x >= 100 ? 0 : x >= 10 ? 1 : 2) + unit;
  }

  // The axis is in billions, millions or thousands of dollars, by the size of the largest amount
  function money() {
    const hi = Math.max(...DATA.flatMap(src => series(src).y.map(Math.abs)));
    return hi >= 1e9 ? { scale: 1e9, name: "billions" }
         : hi >= 1e6 ? { scale: 1e6, name: "millions" }
         : { scale: 1e3, name: "thousands" };
  }

  function yRange(ys) {
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = 0.1 * (hi - lo || Math.abs(hi) || 1);
    return [lo - pad, hi + pad];
  }

  function buildTraces(t, m) {
    const fmt = m ? dollars : v => v.toFixed(current.digits) + (isShare(current) ? "%" : "");
    return DATA.map((src, i) => {
      const s = series(src);
      const y = m ? s.y.map(v => v / m.scale) : s.y;
      return {
        x: s.x,
        y: y,
        name: src.name,
        type: "scatter",
        mode: "lines+markers",
        line: { color: COLORS[i], width: 2, dash: DASHES[i] },
        marker: { color: COLORS[i], symbol: SYMBOLS[i], size: 10, line: { color: t.plot, width: 2 } },
        text: s.y.map(v => "<b>" + fmt(v) + "</b>  " + src.name),
        hovertemplate: "%{text}<extra></extra>",
      };
    });
  }

  // On narrow screens the title wraps onto two lines
  function buildLayout(t, m, traces) {
    const el      = document.getElementById("chart");
    const narrow  = el.offsetWidth < 560;
    const marginT = narrow ? 75 : MARGIN_T;
    const plotH   = Math.max((el.offsetHeight || 480) - marginT - MARGIN_B, 80);
    const years   = series(DATA[0]).x;
    const sep     = narrow ? "<br>" : " – ";
    const title   = isPercentile() ? "Net Worth at the " + ordinal(pct) + " Percentile" + sep + "Canada"
                  : !isShare(current) ? "Gini Coefficient of Net Worth" + sep + "Canada"
                  : (m ? "Average Net Worth" : "Share of Total Net Worth") + sep + current.label + " – Canada";
    const ytitle  = isPercentile() ? "Net Worth (2023 $, " + m.name + ")"
                  : !isShare(current) ? "Gini Coefficient"
                  : m ? "Average Net Worth (2023 $, " + m.name + ")" : "Share of Total Net Worth (%)";
    return {
      title: { text: title },
      font: { color: t.text },
      xaxis: {
        title: { text: "Year" },
        tickmode: "array",
        tickvals: years,
        range: [years[0] - 1, years[years.length - 1] + 1],
        gridcolor: t.grid,
        spikedash: "solid",
        spikethickness: 1,
        spikecolor: t.text,
      },
      yaxis: {
        title: { text: ytitle },
        range: yRange(traces.flatMap(tr => tr.y)),
        gridcolor: t.grid,
        zeroline: false,
      },
      legend: { x: 0.5, xanchor: "center", y: -(55 / plotH), orientation: "h" },
      margin: { l: MARGIN_L, b: MARGIN_B, r: 20, t: marginT },
      hovermode: "x unified",
      hoverlabel: { bgcolor: t.paper, font: { color: t.text } },
      paper_bgcolor: t.paper,
      plot_bgcolor: t.plot,
    };
  }

  function drawChart() {
    const t = darkMode.matches ? THEMES.dark : THEMES.light;
    const m = view.key === "share" ? null : money();
    const traces = buildTraces(t, m);
    Plotly.react("chart", traces, buildLayout(t, m, traces), { responsive: true });
  }

  function button(label, onClick) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "measure-tab";
    btn.textContent = label;
    btn.addEventListener("click", () => { onClick(); syncButtons(); drawChart(); });
    return btn;
  }

  const viewTabs = document.getElementById("view-tabs");
  const tabs = document.getElementById("measure-tabs");
  const viewButtons = VIEWS.map(v => button(v.label, () => {
    view = v;
    if (isAverage() && !isShare(current)) current = MEASURES[2];
  }));
  viewButtons.forEach(btn => viewTabs.appendChild(btn));

  const rows = [];
  const measureButtons = MEASURES.map(m => {
    if (!rows[m.row]) {
      rows[m.row] = document.createElement("div");
      rows[m.row].className = "measure-row";
      tabs.appendChild(rows[m.row]);
    }
    const btn = button(m.label, () => { current = m; });
    rows[m.row].appendChild(btn);
    return btn;
  });

  // average view
  function syncButtons() {
    viewButtons.forEach((b, i) => b.setAttribute("aria-pressed", String(VIEWS[i] === view)));
    measureButtons.forEach((b, i) => {
      b.setAttribute("aria-pressed", String(MEASURES[i] === current));
      b.hidden = isAverage() && !isShare(MEASURES[i]);
    });
    rows.forEach(r => { r.hidden = [...r.children].every(b => b.hidden); });
    document.getElementById("group-controls").hidden = isPercentile();
    document.getElementById("percentile-controls").hidden = !isPercentile();
    document.getElementById("percentile-value").textContent = ordinal(pct);
  }

  // The slider replaces the group buttons in the percentile view
  document.getElementById("percentile").addEventListener("input", e => {
    pct = +e.target.value;
    syncButtons();
    drawChart();
  });

  syncButtons();
  drawChart();
  darkMode.addEventListener("change", drawChart);

  // Recompute the legend position when the chart is resized.
  // Debounced to avoid a relayout -> resize -> relayout loop.
  let resizeTimer;
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawChart, 50);
  }).observe(document.getElementById("chart"));
</script>

</body>
</html>
